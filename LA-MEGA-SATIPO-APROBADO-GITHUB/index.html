<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Radio La Mega Satipo</title>
  <meta name="theme-color" content="#08140c" />
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; background:#06110b; min-height:100%; font-family:Arial, Helvetica, sans-serif; }
    body { display:flex; align-items:flex-start; justify-content:center; }
    .wrap { width:100%; max-width:430px; min-height:100vh; background:#06110b; }
    .hero { width:100%; display:block; height:auto; }
    .note { color:#cfd6cf; text-align:center; padding:10px 14px 24px; font-size:12px; opacity:.8; }
    @media (min-width: 431px) {
      body { padding:18px; background:radial-gradient(circle at top, #12341d 0%, #06110b 65%); }
      .wrap { border-radius:26px; overflow:hidden; box-shadow:0 18px 45px rgba(0,0,0,.45); }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="hero" src="radio_la_mega_satipo_en_vivo_aprobado.png" alt="Diseño móvil aprobado de Radio La Mega Satipo" />
    <div class="note">Versión móvil aprobada para GitHub Pages.</div>
  </main>
</body>
</html>
